name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e "backend/.[dev]"
      - name: Format check
        working-directory: backend
        run: .venv/bin/ruff format --check src tests
      - name: Lint
        working-directory: backend
        run: .venv/bin/ruff check src tests
      - name: Type check
        working-directory: backend
        run: .venv/bin/mypy src
      - name: Install fonts for the dataset generator
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Regenerate eval dataset
        # The 773 generated files are not committed (33 MB); dataset v1
        # regenerates byte-identically from seed 42, and the runner tests
        # read it.
        run: backend/.venv/bin/python evals/generate.py
      - name: Test
        working-directory: backend
        run: .venv/bin/pytest -q
      - name: Lint evals
        run: backend/.venv/bin/ruff check --config backend/pyproject.toml evals
      - name: Type check evals
        run: backend/.venv/bin/mypy --config-file backend/pyproject.toml evals

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e "backend/.[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e
      - name: Run recorded-provider end-to-end tests
        working-directory: frontend
        run: npm run e2e:recorded

  storage-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Azurite
        # Started as a step rather than a service container so it can take
        # --skipApiVersionCheck: the azure-storage-blob SDK can be newer than
        # the API version the emulator accepts.
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:10000/; then echo "Azurite is up"; exit 0; fi
            sleep 1
          done
          echo "Azurite did not start"; docker logs azurite; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e "backend/.[dev]"
      - name: Blob round-trip against Azurite
        working-directory: backend
        # Azurite's public default dev account and key (local emulator
        # only, not a real credential), with the localhost endpoint the
        # service container is mapped to.
        env:
          AZURE_BLOB_TEST_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;"
        run: .venv/bin/pytest -q tests/test_azure_blob_live.py
